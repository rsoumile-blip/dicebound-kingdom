      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          pip install cython==3.0.12
          pip install git+https://github.com/kivy/python-for-android.git

          P4A_DIR="$(python -c 'import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))')"
          ANDROID_RECIPE="$P4A_DIR/recipes/android/__init__.py"

          sed -i \
            's/from pythonforandroid.recipe import PyProjectRecipe, IncludedFilesBehaviour/from pythonforandroid.recipe import PythonRecipe, IncludedFilesBehaviour/' \
            "$ANDROID_RECIPE"

          sed -i \
            's/class AndroidRecipe(IncludedFilesBehaviour, PyProjectRecipe):/class AndroidRecipe(IncludedFilesBehaviour, PythonRecipe):/' \
            "$ANDROID_RECIPE"
