name: Build Dicebound Kingdom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/python-for-android.git
          pip install "Cython<3"

      - name: Build APK
        run: |
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROIDNDK"

          p4a apk \
            --private . \
            --package=org.diceboundkingdom.game \
            --name="The Dicebound Kingdom" \
            --version=2.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --android-api=33 \
            --ndk-api=24 \
            --dist-name=dicebound

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dicebound-kingdom-apk
          path: '**/*.apk'
          if-no-files-found: error
